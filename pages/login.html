<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — AgriAuction</title>
  <link rel="stylesheet" href="/assets/css/fonts.generated.css?v=af471561ab15">
  <link rel="stylesheet" href="/assets/css/tailwind.generated.css?v=ed1f3a198e6d">
  <link rel="stylesheet" href="/assets/css/app-theme.generated.css?v=d361f316dcb6">
  <link rel="stylesheet" href="/assets/css/category-management.css?v=5bf013697d12">
  <link rel="stylesheet" href="/assets/css/branding.css?v=3725253d1cf2">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Đăng nhập</h1>
    <p class="login-description">Truy cập hồ sơ và chức năng được cấp cho tài khoản của bạn.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <button id="login-submit" type="submit">Đăng nhập</button>
    </form>
    <p id="login-message" role="status" aria-live="polite"></p>
    <p class="login-register-link"><a href="/pages/register.html">Đăng ký tài khoản</a></p>
    <button id="login-logout" type="button" hidden>Đăng xuất tài khoản hiện tại</button>
  </main>
  <script src="/assets/js/api-client.js?v=96826630a7ac"></script>
  <script src="/assets/js/login.js?v=aad150d75164"></script>
</body>
</html>
